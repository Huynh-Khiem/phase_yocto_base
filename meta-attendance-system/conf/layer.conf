BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "attendance-system"
BBFILE_PATTERN_attendance-system = "^${LAYERDIR}/"
BBFILE_PRIORITY_attendance-system = "6"
LAYERDEPENDS_attendance-system = "core attendance rtsp-camera meta-pir meta-tft"
LAYERSERIES_COMPAT_attendance-system = "kirkstone"
