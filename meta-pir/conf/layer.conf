BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pir"
BBFILE_PATTERN_meta-pir = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pir = "6"

LAYERDEPENDS_meta-pir = "core raspberrypi"
LAYERSERIES_COMPAT_meta-pir = "kirkstone"
