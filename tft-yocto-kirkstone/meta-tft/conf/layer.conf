BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tft"
BBFILE_PATTERN_meta-tft = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tft = "6"

LAYERDEPENDS_meta-tft = "core raspberrypi"
LAYERSERIES_COMPAT_meta-tft = "kirkstone"
