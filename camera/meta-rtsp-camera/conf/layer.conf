BBFILE_PRIORITY_rtsp-camera = "6"
LAYERSERIES_COMPAT_rtsp-camera = "kirkstone"
LAYERDEPENDS_rtsp-camera = "core raspberrypi openembedded-layer meta-python networking-layer"
